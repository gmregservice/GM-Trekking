name: Build APK

# Compila l'app ad ogni push su main e ad ogni pull request, cosi' l'APK e'
# sempre scaricabile dagli Artifacts di questa Action, senza dover installare
# Android Studio in locale solo per ottenere un file installabile.
#
# NOTA: il repository non include gradle/wrapper/gradle-wrapper.jar (file
# binario, non generabile nell'ambiente in cui e' stato creato questo
# scheletro). Per questo il workflow installa Gradle direttamente con
# gradle/actions/setup-gradle invece di usare ./gradlew. Se in seguito
# generi il wrapper in locale (vedi README.md), puoi tornare a usare
# ./gradlew qui senza altre modifiche.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Compila anche una APK di release (non firmata)"
        type: boolean
        default: false

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Imposta JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Imposta Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Compila APK di debug
        run: gradle assembleDebug --stacktrace

      - name: Carica APK di debug come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gm-trekking-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Imposta JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Imposta Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Compila APK di release (non firmata)
        run: gradle assembleRelease --stacktrace

      - name: Carica APK di release come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gm-trekking-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
